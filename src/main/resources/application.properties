spring.application.name=entomo-gdhcn-ms
server.port=8082
spring.profiles.active =
filesystem.baseLocation = 
filesystem.folderName = json

aws.bucket.access.key=
aws.bucket.access.secret=
aws.bucket.region=sa-east-1
aws.bucket.s3.bucket.name=gdhcn-ips
aws.bucket.s3.json.folder=json

gdhcn.baseUrl=https://gdhcn-validator.net
gdhcn.dev.url = https://tng-dev.who.int
# Where the DSCs come from: "did" = public DID document (no mTLS), "tng" = mTLS call to the TNG API (needs tng.tls.*)
gdhcn.trustlist.mode=did
gdhcn.trustlist.did.url=https://tng-cdn-dev.who.int/v2/trustlist/did.json
gdhcn.trustlist.ttl-minutes=60
gdhcn.trustlist.min-refresh-seconds=60
gdhcn.trustlist.max-stale-hours=24
spring.datasource.url =
spring.datasource.username = 
spring.datasource.password =
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto = validate
spring.flyway.baseline-on-migrate = true
spring.flyway.baseline-version = 1
# Required for CREATE INDEX CONCURRENTLY (V2): the default transactional advisory lock would block it
spring.flyway.postgresql.transactional-lock = false
spring.jpa.show-sql = false
spring.datasource.driver-class-name = org.postgresql.Driver
spring.jpa.properties.hibernate.jdbc.time_zone = UTC

tng.tls.pem =
tng.tls.key = 
tng.country = XM
tng.dsc.privateKey =
tng.dsc.privateKey.kid = 

# In minutes
ips.shlink.expiry = 60
# Lifetime limit of wrong passcodes per link; afterwards the link answers 404
vhl.pin.max-attempts = 5
# Origins (comma separated) allowed to call the manifest and the IPS download from a browser; empty = no CORS headers
vhl.cors.allowed-origins =

# Operation: only health is exposed (no details); the readiness group is what the load balancer should probe
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,trustList

# Cold start of a paused Aurora Serverless v2 cluster takes tens of seconds: keep retrying instead of failing
spring.datasource.hikari.connection-timeout=90000
spring.datasource.hikari.initialization-fail-timeout=120000
spring.flyway.connect-retries=12
spring.flyway.connect-retries-interval=10s
